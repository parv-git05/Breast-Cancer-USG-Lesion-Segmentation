data:
  raw_root: "D:/Dataset_BUSI_with_GT"
  manifest: "data/manifests/BUSI_phase1_manifest.csv"
  excluded: "data/manifests/BUSI_phase1_excluded.csv"
  splits_dir: "data/splits"
  split_seed: 42
  split_ratios: [0.70, 0.15, 0.15]
  image_size: [256, 256]

preprocessing:
  grayscale: true
  normalize: "minmax"
  augmentation: true

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.5
  rotation_deg: 15
  brightness: 0.2
  contrast: 0.2
  elastic: false

hardware:
  device: "auto"
  deterministic: true
  num_workers: 0
