data:
  raw_root: ".."
  manifest: "data/manifests/BUSI_phase1_manifest.csv"
  excluded: "data/manifests/BUSI_phase1_excluded.csv"
  manifests_dir: "data/manifests"
  folds_dir: "data/folds/exp_seg_02"
  test_dir: "data/test_set"
  test_size: 63
  n_splits: 3
  seed: 42
  image_size: [256, 256]

preprocessing:
  grayscale: true
  normalize: "minmax"
  augmentation: true

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.5
  rotation_deg: 15
  brightness: 0.2
  contrast: 0.2
  elastic: false

hardware:
  device: "auto"
  deterministic: true
  num_workers: 0
